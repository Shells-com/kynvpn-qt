name: Prepare build environment
description: Free disk space, set up build tools and restore the previous stage's build state.
inputs:
  kind:
    description: linux or macos
    required: true
  restore:
    description: Name of the state artifact to restore (empty for the first stage)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Free disk space (Linux)
      if: inputs.kind == 'linux'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
        sudo docker image prune --all --force >/dev/null || true
        df -h /

    - name: Free disk space (macOS)
      if: inputs.kind == 'macos'
      shell: bash
      run: |
        df -h /
        free_gb="$(df -g / | awk 'NR==2 {print $4}')"
        if [ "$free_gb" -ge 60 ]; then echo "Enough space"; exit 0; fi
        # Keep only the selected Xcode; drop simulators and the Android SDK.
        selected="$(xcode-select -p | sed 's|/Contents/Developer||')"
        for x in /Applications/Xcode*.app; do
          if [ "$x" != "$selected" ] && [ ! -L "$x" ]; then sudo rm -rf "$x"; fi
        done
        xcrun simctl delete all >/dev/null 2>&1 || true
        sudo rm -rf ~/Library/Android /Library/Developer/CoreSimulator/Profiles/Runtimes || true
        df -h /

    - name: Build container image (Linux)
      if: inputs.kind == 'linux'
      shell: bash
      run: docker build -t qt-builder -f docker/linux-builder.Dockerfile .

    - name: Install build tools (macOS)
      if: inputs.kind == 'macos'
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/buildtools"
        "$RUNNER_TEMP/buildtools/bin/pip" install --no-cache-dir -r requirements-build.txt
        command -v zstd >/dev/null || brew install zstd
        command -v xz >/dev/null || brew install xz
        echo "$RUNNER_TEMP/buildtools/bin" >> "$GITHUB_PATH"
        xcode-select -p
        xcodebuild -version
        clang --version

    - name: Download previous stage
      if: inputs.restore != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.restore }}
        path: ${{ runner.temp }}/state

    - name: Restore previous stage
      if: inputs.restore != ''
      shell: bash
      run: |
        zstd -dc "$RUNNER_TEMP/state/state.tar.zst" | tar -xf -
        rm -rf "$RUNNER_TEMP/state"
        ls out/install/*/*/share/qt-build-info/
