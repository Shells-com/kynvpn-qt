name: Save build state
description: Archive the Qt installation and dependency prefix for the next stage.
inputs:
  name:
    description: Artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Archive state
      shell: bash
      run: |
        tar -cf - out/install out/deps | zstd -T0 -3 -o "$RUNNER_TEMP/state.tar.zst"
        ls -lh "$RUNNER_TEMP/state.tar.zst"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/state.tar.zst
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
